name: Build memory 2.0 APK
on:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate memory 2.0 project
        run: python3 memory-v2/generate_project.py
      - name: Reuse confirmed transparent floating icon
        run: cp mnemonic-bridge-v0.4/app/src/main/res/drawable/ic_overlay_bridge.png memory-v2/app/src/main/res/drawable/ic_overlay_bridge.png
      - name: Build APK
        working-directory: memory-v2
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp memory-v2/app/build/outputs/apk/debug/app-debug.apk memory-v2.0-no-accessibility.apk
      - uses: actions/upload-artifact@v4
        with:
          name: memory-v2.0-no-accessibility
          path: memory-v2.0-no-accessibility.apk
          if-no-files-found: error
